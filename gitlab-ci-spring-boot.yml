# =====================================================================
# GitLab CI/CD Pipeline — Spring Boot Application
# Integrates with two external systems: "System A" and "System B"
# (mocked here via WireMock; swap for Testcontainers/real endpoints
#  as needed in your environment)
# =====================================================================

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  SONAR_HOST_URL: "https://sonarqube.yourcompany.com"
  SONAR_PROJECT_KEY: "your-project-key"
  DOCKER_IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  SYSTEM_A_MOCK_PORT: "8081"
  SYSTEM_B_MOCK_PORT: "8082"

default:
  image: maven:3.9.6-eclipse-temurin-17
  cache:
    key:
      files:
        - pom.xml
    paths:
      - .m2/repository

stages:
  - validate
  - build
  - test
  - integration-test
  - code-quality
  - sonarqube-check
  - security
  - package
  - deploy-staging
  - deploy-production

# ---------------------------------------------------------------------
# VALIDATE — runs only on merge request pipelines
# ---------------------------------------------------------------------
merge-request-checks:
  stage: validate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - mvn $MAVEN_CLI_OPTS validate
    - mvn $MAVEN_CLI_OPTS checkstyle:check
  allow_failure: false

# ---------------------------------------------------------------------
# BUILD — compile Java classes
# ---------------------------------------------------------------------
compile:
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS compile
  artifacts:
    paths:
      - target/classes
    expire_in: 1 hour

# ---------------------------------------------------------------------
# UNIT TESTS
# ---------------------------------------------------------------------
unit-tests:
  stage: test
  needs:
    - compile
  script:
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/jacoco.exec
      - target/classes
    expire_in: 1 day
  coverage: '/Total.*?([0-9]{1,3})%/'

# ---------------------------------------------------------------------
# INTEGRATION TESTS — brings up mocks for System A and System B
# ---------------------------------------------------------------------
integration-tests:
  stage: integration-test
  needs:
    - unit-tests
  services:
    - name: wiremock/wiremock:3.3.1
      alias: system-a-mock
      command: ["--port", "$SYSTEM_A_MOCK_PORT"]
    - name: wiremock/wiremock:3.3.1
      alias: system-b-mock
      command: ["--port", "$SYSTEM_B_MOCK_PORT"]
  variables:
    SYSTEM_A_BASE_URL: "http://system-a-mock:$SYSTEM_A_MOCK_PORT"
    SYSTEM_B_BASE_URL: "http://system-b-mock:$SYSTEM_B_MOCK_PORT"
  script:
    - >
      mvn $MAVEN_CLI_OPTS verify -Pintegration-test
      -Dsystem-a.url=$SYSTEM_A_BASE_URL
      -Dsystem-b.url=$SYSTEM_B_BASE_URL
  artifacts:
    when: always
    reports:
      junit:
        - target/failsafe-reports/TEST-*.xml
    paths:
      - target/jacoco-it.exec
    expire_in: 1 day

# ---------------------------------------------------------------------
# CODE COVERAGE — merges unit + integration coverage via JaCoCo
# ---------------------------------------------------------------------
jacoco-report:
  stage: code-quality
  needs:
    - unit-tests
    - integration-tests
  script:
    - mvn $MAVEN_CLI_OPTS jacoco:report jacoco:report-aggregate
  coverage: '/Total.*?([0-9]{1,3})%/'
  artifacts:
    paths:
      - target/site/jacoco/jacoco.xml
      - target/site/jacoco-aggregate
    reports:
      coverage_report:
        coverage_format: jacoco
        path: target/site/jacoco/jacoco.xml
    expire_in: 1 week

# ---------------------------------------------------------------------
# SONARQUBE — static analysis + quality gate
# ---------------------------------------------------------------------
sonarqube-analysis:
  stage: sonarqube-check
  needs:
    - jacoco-report
  script:
    - >
      mvn $MAVEN_CLI_OPTS sonar:sonar
      -Dsonar.projectKey=$SONAR_PROJECT_KEY
      -Dsonar.host.url=$SONAR_HOST_URL
      -Dsonar.login=$SONAR_TOKEN
      -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
      -Dsonar.junit.reportPaths=target/surefire-reports,target/failsafe-reports
  allow_failure: false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

sonarqube-quality-gate:
  stage: sonarqube-check
  needs:
    - sonarqube-analysis
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner -Dsonar.qualitygate.wait=true -Dsonar.host.url=$SONAR_HOST_URL -Dsonar.login=$SONAR_TOKEN
  allow_failure: false

# ---------------------------------------------------------------------
# SECURITY — pulls in GitLab's built-in security templates
# ---------------------------------------------------------------------
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/Container-Scanning.gitlab-ci.yml
  - template: Security/License-Scanning.gitlab-ci.yml

sast:
  stage: security

dependency_scanning:
  stage: security

license_scanning:
  stage: security
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

secret_detection:
  stage: security
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------
# PACKAGE — build the jar, then a container image
# ---------------------------------------------------------------------
build-jar:
  stage: package
  needs:
    - unit-tests
  script:
    - mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

build-docker-image:
  stage: package
  image: docker:24.0
  services:
    - docker:24.0-dind
  needs:
    - build-jar
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA .
    - docker push $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

container_scanning:
  stage: security
  needs:
    - build-docker-image
  variables:
    CS_IMAGE: $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------------------------
# DEPLOY
# ---------------------------------------------------------------------
deploy-staging:
  stage: deploy-staging
  needs:
    - build-docker-image
  environment:
    name: staging
    url: https://staging.yourapp.com
  script:
    - echo "Deploying $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA to staging"
    - kubectl set image deployment/spring-boot-app app=$DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA -n staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-production:
  stage: deploy-production
  needs:
    - deploy-staging
  environment:
    name: production
    url: https://yourapp.com
  script:
    - echo "Deploying $DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA to production"
    - kubectl set image deployment/spring-boot-app app=$DOCKER_IMAGE_NAME:$CI_COMMIT_SHORT_SHA -n production
  when: manual
  rules:
    - if: '$CI_COMMIT_TAG'
