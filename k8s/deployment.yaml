apiVersion: apps/v1
kind: Deployment
metadata:
    name: myapp-deployment
    annotations:
      kubernetes.io/change-cause: "Initial deployment of myapp"
    labels: 
      app: myapp
      type: front-end
spec:
  template:
    metadata:
      name: my-pod
      labels:
        app: myapp
        type: front-end
    spec: 
      containers:
        - name: nginx-containers
          image: nginx:1.8912
  replicas: 3
  selector:
    matchLabels:
      type: front-end
