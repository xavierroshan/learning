apiVersion: apps/v1
kind: ReplicaSet
metadata:
    name: myapp-rs
    labels: 
      app: myapp-replicaSet
      type: front-end
spec:
  template:
    metadata:
      name: my-app-rs
      labels:
        app: nginx
        type: front-end
    spec: 
      containers:
        - name: nginx
          image: nginx 
  replicas: 3
  selector:
    matchLabels:
      type: front-end
