# =============================================================================
# /etc/nginx/nginx.conf  -  production-style config: React/Vue SPA + /api backend
# Layout:
#   /etc/nginx/nginx.conf                     (this file)
#   /etc/nginx/snippets/security-headers.conf
#   /etc/nginx/snippets/proxy.conf
# Replace example.com, paths and upstream addresses with your own.
# Always test before reloading:  sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

user  nginx;
worker_processes  auto;                    # one worker per CPU core
worker_rlimit_nofile 65535;                # max open files per worker
pid   /run/nginx.pid;

# (6) Dedicated error log. Levels: debug, info, notice, warn, error, crit.
# "warn" is a good production level; use "info" or "debug" only while troubleshooting.
error_log  /var/log/nginx/error.log  warn;

events {
    worker_connections  4096;
    multi_accept        off;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # -------------------------------------------------------------------------
    # (12) Global hardening and tuning
    # -------------------------------------------------------------------------
    server_tokens off;                     # hide nginx version in headers and error pages

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;

    keepalive_timeout   65s;
    keepalive_requests  1000;

    client_max_body_size        10m;       # reject larger uploads with 413
    client_body_buffer_size     16k;
    client_header_buffer_size   2k;
    large_client_header_buffers 4 8k;

    # Short timeouts blunt slow-connection attacks (Slowloris)
    client_header_timeout  15s;
    client_body_timeout    15s;
    send_timeout           30s;
    reset_timedout_connection on;

    # Cache open file descriptors / metadata for static files
    open_file_cache          max=2000 inactive=30s;
    open_file_cache_valid    60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    # -------------------------------------------------------------------------
    # (6) Logging with buffering
    # -------------------------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time urt=$upstream_response_time '
                    'ua=$upstream_addr';

    # Writes in 32k batches, or at least every 5 seconds: far fewer disk writes
    access_log /var/log/nginx/access.log main buffer=32k flush=5s;

    # -------------------------------------------------------------------------
    # (8) Gzip
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_comp_level   5;                   # 1-9; 4-6 is the sweet spot for CPU vs size
    gzip_min_length   256;                 # tiny responses are not worth compressing
    gzip_vary         on;                  # adds "Vary: Accept-Encoding" for caches
    gzip_proxied      any;                 # also compress responses from the upstream
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/manifest+json
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;
    # text/html is always compressed. Do NOT add png/jpg/webp/woff2/zip: already compressed.

    # -------------------------------------------------------------------------
    # (5) Rate limiting zones (10 MB of shared memory holds ~160k IP states each)
    # NOTE: behind a CDN or load balancer, $binary_remote_addr is the proxy's IP.
    # Configure real_ip_header / set_real_ip_from first, or everyone shares one bucket.
    # -------------------------------------------------------------------------
    limit_req_zone  $binary_remote_addr  zone=general:10m  rate=10r/s;
    limit_req_zone  $binary_remote_addr  zone=login:10m    rate=5r/m;
    limit_conn_zone $binary_remote_addr  zone=perip:10m;

    limit_req_status   429;                # "Too Many Requests" instead of the default 503
    limit_conn_status  429;
    limit_req_log_level warn;

    # -------------------------------------------------------------------------
    # WebSocket-friendly Connection header. Empty value keeps upstream keepalive working.
    # -------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # -------------------------------------------------------------------------
    # (4) Upstream with passive health checks, backup server and keepalive
    # -------------------------------------------------------------------------
    upstream app_backend {
        least_conn;                        # must come BEFORE keepalive

        # max_fails/fail_timeout = passive health check: after 3 failures within 30s,
        # the server is taken out of rotation for 30s, then retried.
        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s weight=3;
        server 127.0.0.1:8081 max_fails=3 fail_timeout=30s weight=3;
        server 127.0.0.1:8082 backup;      # only used when all the above are down

        keepalive          32;             # idle connections kept open per worker
        keepalive_requests 1000;
        keepalive_timeout  60s;
    }

    # -------------------------------------------------------------------------
    # Catch-all: requests with an unknown Host header or direct-IP scans.
    # Closes the connection without a response (444) and refuses the TLS handshake.
    # -------------------------------------------------------------------------
    server {
        listen 80  default_server;
        listen [::]:80 default_server;
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_reject_handshake on;           # nginx 1.19.4+; no certificate needed here
        return 444;
    }

    # -------------------------------------------------------------------------
    # (1) HTTP server: ACME bypass + redirect everything else to HTTPS
    # -------------------------------------------------------------------------
    server {
        listen 80;
        listen [::]:80;
        server_name example.com www.example.com;

        # Let's Encrypt HTTP-01 challenge must be served over plain HTTP, no redirect.
        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://example.com$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # www -> apex redirect over HTTPS (same certificate must cover both names)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;                          # nginx 1.25.1+. On older: "listen 443 ssl http2;"
        server_name www.example.com;

        ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

        return 301 https://example.com$request_uri;
    }

    # -------------------------------------------------------------------------
    # Main HTTPS site
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name example.com;

        root  /var/www/example/dist;       # build output (npm run build)
        index index.html;

        # ---------------------------------------------------------------------
        # (2) Modern TLS
        # ---------------------------------------------------------------------
        ssl_certificate         /etc/letsencrypt/live/example.com/fullchain.pem;
        ssl_certificate_key     /etc/letsencrypt/live/example.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/example.com/chain.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers   ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;     # modern clients choose well; TLS 1.3 ignores this

        ssl_session_cache   shared:SSL:10m;    # ~40,000 sessions; speeds up repeat handshakes
        ssl_session_timeout 1d;
        ssl_session_tickets off;               # tickets weaken forward secrecy unless keys rotate

        # OCSP stapling: server attaches the certificate's revocation status to the handshake.
        # NOTE: Let's Encrypt ended OCSP support in 2025, and its certificates no longer
        # contain an OCSP URL. With them nginx logs "no OCSP responder URL" and stapling
        # does nothing. Keep this block for certificates from CAs that still use OCSP.
        ssl_stapling        on;
        ssl_stapling_verify on;
        resolver            1.1.1.1 8.8.8.8 valid=300s ipv6=off;
        resolver_timeout    5s;

        # ---------------------------------------------------------------------
        # (3) Security headers + (12) per-IP connection and method limits
        # ---------------------------------------------------------------------
        include /etc/nginx/snippets/security-headers.conf;

        limit_conn perip 50;               # max simultaneous connections per IP

        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) {
            return 405;
        }

        # ---------------------------------------------------------------------
        # (11) Custom error pages
        # ---------------------------------------------------------------------
        error_page 404             /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /404.html {
            internal;
            root /var/www/example/errors;
        }
        location = /50x.html {
            internal;
            root /var/www/example/errors;
        }

        # ---------------------------------------------------------------------
        # (11) Health check endpoint (answered by nginx itself; no backend hit)
        # Restricted to localhost and private ranges (monitoring, load balancer).
        # ---------------------------------------------------------------------
        location = /healthz {
            access_log off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny  all;
            default_type text/plain;
            return 200 "ok\n";
        }

        # ---------------------------------------------------------------------
        # (10) Deny sensitive files. Regex locations are checked in order and the first
        # match wins, so these must sit BEFORE the static-asset regex below.
        # ---------------------------------------------------------------------
        location ~ /\.(?!well-known) {                 # .env, .git, .htaccess, .DS_Store ...
            access_log off;
            log_not_found off;
            return 404;                                # 404, not 403: don't confirm the file exists
        }

        location ~* "(^|/)(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|Gemfile(\.lock)?|requirements\.txt|Dockerfile|docker-compose\.ya?ml|Makefile)$" {
            access_log off;
            log_not_found off;
            return 404;
        }

        location ~* "\.(bak|backup|old|orig|swp|sql|sqlite|log|ini|conf|yml|yaml)$" {
            return 404;
        }

        # ---------------------------------------------------------------------
        # (5) API proxy with rate limiting. ^~ beats the regex locations.
        # ---------------------------------------------------------------------
        # Stricter limit on login: 5 requests/minute/IP, burst of 3 extra, then 429.
        # Exact match (=) is checked first, so it wins over /api/.
        location = /api/auth/login {
            limit_req zone=login burst=3 nodelay;
            include /etc/nginx/snippets/proxy.conf;
            proxy_pass http://app_backend;
        }

        # General API limit: 10 req/s/IP, bursts of 20 allowed.
        location ^~ /api/ {
            limit_req zone=general burst=20 nodelay;
            include /etc/nginx/snippets/proxy.conf;
            proxy_pass http://app_backend;
        }

        # ---------------------------------------------------------------------
        # (7) Static asset caching
        # ---------------------------------------------------------------------
        # Hashed bundles (Vite writes /assets/index-Ab12Cd34.js, CRA writes /static/js/...).
        # The filename changes whenever the content does, so cache for a year, never revalidate.
        # Missing files must 404, not fall back to index.html.
        location ^~ /assets/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
            try_files $uri =404;
        }
        location ^~ /static/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
            try_files $uri =404;
        }

        # Other static files with stable names (favicon, images, fonts): cache for a week.
        location ~* \.(?:ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|otf|css|js|map|txt|xml|webmanifest)$ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=604800" always;
            access_log off;
            try_files $uri =404;
        }

        # index.html must never be cached long-term: it points at the current hashed bundles.
        location = /index.html {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # ---------------------------------------------------------------------
        # (9) SPA fallback: unknown paths such as /dashboard/42 are routed by the
        # front-end router, so hand them index.html instead of a 404.
        # ---------------------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
