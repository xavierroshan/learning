# /etc/nginx/snippets/proxy.conf
#
# Shared reverse-proxy settings. Included inside each location that has a proxy_pass.
# Put it in a snippet because proxy_set_header directives are also not inherited once
# a location defines even one of its own.

# Required for upstream keepalive: HTTP/1.1 and an empty Connection header
# ($connection_upgrade is '' normally, "upgrade" for WebSocket requests).
proxy_http_version 1.1;
proxy_set_header   Connection  $connection_upgrade;
proxy_set_header   Upgrade     $http_upgrade;

# Tell the app who the real client is and that the original request was HTTPS
proxy_set_header   Host               $host;
proxy_set_header   X-Real-IP          $remote_addr;
proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
proxy_set_header   X-Forwarded-Proto  $scheme;
proxy_set_header   X-Forwarded-Host   $host;

# Timeouts: fail fast if the backend is down, but allow slow endpoints some time
proxy_connect_timeout  5s;
proxy_send_timeout     60s;
proxy_read_timeout     60s;

# Retry on the next server when one fails (works with the upstream health checks).
# Non-idempotent requests (POST, etc.) are NOT retried by default, which is what you want.
proxy_next_upstream          error timeout http_502 http_503 http_504;
proxy_next_upstream_tries    2;
proxy_next_upstream_timeout  10s;

# Buffer upstream responses so slow clients don't tie up the app server
proxy_buffering  on;
proxy_buffers    16 16k;
proxy_buffer_size 16k;

# Let nginx's own custom error pages handle upstream-down (502/503/504)
proxy_intercept_errors off;
