# /etc/nginx/snippets/security-headers.conf
#
# WHY A SNIPPET: nginx's add_header is NOT additive across levels. If a location block
# defines any add_header of its own (for example Cache-Control), it discards every
# add_header inherited from the server block. So every location that sets a header must
# include this file again. "always" sends the header on error responses (4xx/5xx) too.

# HSTS: browsers will only use HTTPS for this domain for 2 years.
# Start with max-age=300 while testing. Add "preload" only after reading hstspreload.org:
# it is very hard to undo.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Block clickjacking (embedding your site in someone else's iframe)
add_header X-Frame-Options "DENY" always;

# Stop browsers from guessing content types (MIME sniffing)
add_header X-Content-Type-Options "nosniff" always;

# Limit how much of the URL is leaked to other sites in the Referer header
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Turn off browser features you don't use
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Isolate the page from cross-origin windows
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Content-Security-Policy: the strongest header, but also the one most likely to break
# a site. Test with "Content-Security-Policy-Report-Only" first, then tighten.
# This baseline suits a SPA that loads only its own scripts and calls its own /api.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
